<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NEXORA Studio — Digital Experiences Beyond Ordinary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ===== 1. COLORS & FONTS — change these values to restyle the whole site ===== */
:root{
  color-scheme:dark;
  --bg:#04050b; --mid:#0a1233;
  --blue:#2d8cff; --violet:#8b5cff; --cyan:#22d3ee;
  --text:#eaf0ff; --muted:#93a0c4;
  --glass:rgba(255,255,255,.05); --line:rgba(130,160,255,.18);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --grad:linear-gradient(120deg,var(--blue),var(--violet));
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,var(--mid),transparent 60%),radial-gradient(900px 600px at -10% 40%,#10073a,transparent 60%),var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,100% - 40px);margin:0 auto}
section{padding:96px 0;position:relative}
h2{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:.2em 0 .5em;letter-spacing:-.02em}
.eyebrow{color:var(--blue);font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;font-weight:600}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted)}
/* glow blobs (parallax) */
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0}
/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(4,5,11,.8);z-index:60}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(4,5,11,.55);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-weight:800;letter-spacing:.04em}
.links{display:flex;gap:6px}
.links a{padding:8px 14px;border-radius:99px;color:var(--muted);font-size:.92rem;transition:.25s}
.links a:hover,.links a.on{color:#fff;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line)}
.burger{display:none;background:none;border:1px solid var(--line);color:#fff;border-radius:12px;width:44px;height:44px;font-size:1.3rem}
@media(max-width:760px){
  .burger{display:block}
  .links{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));left:12px;right:12px;flex-direction:column;background:rgba(8,12,34,.96);border:1px solid var(--line);border-radius:20px;padding:10px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.3s}
  .links.open{transform:none;opacity:1;pointer-events:auto}
  .links a{padding:14px 16px;font-size:1.05rem}
}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:99px;font-weight:600;border:0;cursor:pointer;font:inherit;font-weight:600;color:#fff;transition:transform .25s,box-shadow .25s}
.btn.primary{background:var(--grad);box-shadow:0 0 28px rgba(80,120,255,.45)}
.btn.primary:hover{transform:translateY(-3px);box-shadow:0 0 44px rgba(139,92,255,.7)}
.btn.ghost{background:var(--glass);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{transform:translateY(-3px);background:rgba(255,255,255,.1)}
/* hero */
#home{min-height:100svh;display:flex;align-items:center;padding-top:110px;overflow:hidden}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;position:relative;z-index:1}
h1{font-size:clamp(2.4rem,7.2vw,4.6rem);line-height:1.04;letter-spacing:-.03em;margin:.3em 0}
.sub{font-size:1.1rem;max-width:520px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.orbbox{position:relative;aspect-ratio:1;width:100%;max-width:520px;margin-left:auto;touch-action:pan-y}
#orb{position:absolute;inset:-20%;width:140%;height:140%;display:block;cursor:grab;background:transparent;border:0;outline:0;box-shadow:none}
#orbFallback{display:none;position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.55),rgba(45,140,255,.35) 25%,rgba(139,92,255,.25) 55%,transparent 72%);box-shadow:0 0 80px rgba(80,120,255,.5),inset 0 0 60px rgba(139,92,255,.5);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-18px)}}
.scrollhint{position:absolute;bottom:22px;left:50%;translate:-50% 0;color:var(--muted);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase}
@media(max-width:860px){.hero{grid-template-columns:1fr;text-align:center}.sub{margin:0 auto}.cta{justify-content:center}.orbbox{order:-1;max-width:min(240px,68vw);margin:0 auto}#home{padding-top:96px}.scrollhint{display:none}}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.stat b{display:block;font-size:1.5rem}.stat span{font-size:.78rem;color:var(--muted)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:30px;backdrop-filter:blur(10px)}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:7px 14px;border-radius:99px;font-size:.82rem;border:1px solid var(--line);background:rgba(45,140,255,.08);color:#c9d6ff}
@media(max-width:860px){.about{grid-template-columns:1fr}}
/* projects */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;perspective:1200px}
.card{position:relative;border-radius:26px;background:var(--glass);border:1px solid var(--line);overflow:hidden;transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .3s;will-change:transform}
.card:hover{box-shadow:0 20px 60px rgba(60,90,255,.3),0 0 0 1px rgba(139,92,255,.5)}
.art{height:190px;position:relative;overflow:hidden}
.art i{position:absolute;border-radius:50%;filter:blur(2px);animation:drift 9s ease-in-out infinite}
.art .n{position:absolute;inset:auto 16px 12px auto;font-weight:800;font-size:2.6rem;opacity:.18}
@keyframes drift{50%{transform:translate(18px,-14px) scale(1.12)}}
.cbody{padding:22px;transform:translateZ(30px)}
.cbody h3{margin:.2em 0;font-size:1.3rem;letter-spacing:.02em}
.cbody .tag{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.cbody .more{display:inline-block;margin-top:8px;color:#fff;font-weight:600}
.cbody .more:hover{color:var(--blue)}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
/* services */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.s{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:26px;transition:.3s}
.s:hover{transform:translateY(-6px);border-color:rgba(139,92,255,.6);box-shadow:0 0 36px rgba(139,92,255,.25)}
.s .ic{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:1.3rem;margin-bottom:12px;box-shadow:0 0 22px rgba(80,120,255,.5)}
.s h3{margin:.2em 0}
@media(max-width:980px){.svc{grid-template-columns:1fr 1fr}}@media(max-width:560px){.svc{grid-template-columns:1fr}}
/* contact */
.contact{text-align:center;max-width:680px;margin:0 auto}
form{display:grid;gap:12px;margin-top:26px;text-align:left}
input,textarea{width:100%;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,140,255,.25)}
.note{font-size:.8rem;text-align:center}
footer{padding:30px 0 50px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.art i,#orbFallback{animation:none}}
/* ===== NEXORA Studio upgrades ===== */
.logo{letter-spacing:.24em;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.logo::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
#eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#bcd3ff;letter-spacing:.32em;font-size:.72rem}
#eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
h1 .grad{background:linear-gradient(110deg,var(--blue),var(--violet) 60%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-size:clamp(.74rem,2.6vw,.95rem);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin:0 0 14px}
.orbbox::before{content:"";position:absolute;inset:-10%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(45,140,255,.26),rgba(139,92,255,.14) 50%,transparent),radial-gradient(closest-side,rgba(34,211,238,.1),transparent 60%)}
#orb{z-index:1}
.hero>div:first-child{position:relative;z-index:2}
.orbbox{overflow:visible}
.btn.ghost,.card,.s,.panel,.stat{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.badge{position:absolute;top:14px;left:14px;padding:5px 12px;border-radius:99px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;background:rgba(4,5,11,.55);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#dfe8ff;z-index:2}
.mock{position:absolute;left:16%;right:16%;bottom:-6px;height:92px;border-radius:14px 14px 0 0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 12px;transition:transform .5s}
.card:hover .mock{transform:translateY(-14px)}
.card:hover .art i{animation-duration:4s}
.mock u{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);margin-right:5px}
.mock b{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:9px;width:70%}
.mock b+b{width:45%}
.ic svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.s:hover .ic{box-shadow:0 0 30px rgba(34,211,238,.6)}
.contact .btn{margin-top:6px}
.btn,.links a,.burger,.more{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.cbody .more{display:inline-flex;align-items:center;min-height:44px;margin-top:14px;padding:0 18px;border-radius:99px;font:inherit;font-weight:600;font-size:.9rem;color:#fff;background:var(--glass);border:1px solid var(--line);transition:.25s}
.cbody a.more:hover{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 0 24px rgba(80,120,255,.45)}
.cbody .more.off,.cbody .more.off:hover{color:var(--muted);opacity:.65;cursor:not-allowed}
.card[data-url]{cursor:pointer}
.blob{animation:bd 14s ease-in-out infinite alternate}
@keyframes bd{to{translate:30px -24px}}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px;margin:8px 0}
.flinks a{padding:12px 8px}.flinks a:hover{color:#fff}
footer .fb{margin:0;color:var(--text)}
@media(min-width:600px) and (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){section{padding:68px 0}h1{font-size:clamp(2.1rem,9vw,2.6rem)}.cta .btn{flex:1 1 100%;justify-content:center}}
@media(prefers-reduced-motion:reduce){.mock,.btn,.s,.card{transition:none}.blob{animation:none}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a href="#home" class="logo grad" id="logo"></a>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <div class="links" id="links"></div>
</div></nav>

<section id="home">
  <div class="blob" data-speed="0.15" style="width:420px;height:420px;background:var(--blue);top:8%;left:-120px"></div>
  <div class="blob" data-speed="-0.1" style="width:380px;height:380px;background:var(--violet);bottom:0;right:-100px"></div>
  <div class="blob" data-speed="0.08" style="width:300px;height:300px;background:var(--cyan);top:55%;left:38%;opacity:.14"></div>
  <div class="wrap hero">
    <div>
      <div class="eyebrow rv" id="eyebrow"></div>
      <h1 class="rv" style="--d:.1s" id="headline"></h1>
      <p class="tagline rv" style="--d:.15s" id="tagline"></p>
      <p class="sub rv" style="--d:.2s" id="sub"></p>
      <div class="cta rv" style="--d:.3s">
        <a class="btn primary" href="#projects" id="cta1"></a>
        <a class="btn ghost" href="#contact" id="cta2"></a>
      </div>
    </div>
    <div class="orbbox rv" style="--d:.2s"><canvas id="orb"></canvas><div id="orbFallback"></div></div>
  </div>
  <div class="scrollhint">Scroll</div>
</section>

<section id="about"><div class="wrap about">
  <div class="rv"><div class="eyebrow">About</div><h2 id="aboutTitle"></h2><p id="aboutText"></p>
    <div class="stats" id="stats"></div></div>
  <div class="panel rv" style="--d:.15s"><h3 style="margin:0">What we work with</h3><div class="skills" id="skills"></div>
    <p id="aboutNote" style="margin-bottom:0"></p></div>
</div></section>

<section id="projects"><div class="wrap">
  <div class="rv"><div class="eyebrow">Projects</div><h2 id="projTitle"></h2><p id="projSub"></p></div>
  <div class="grid" id="cards"></div>
</div></section>

<section id="services"><div class="wrap">
  <div class="rv"><div class="eyebrow">Services</div><h2 id="svcTitle"></h2></div>
  <div class="svc" id="svc"></div>
</div></section>

<section id="contact"><div class="wrap contact">
  <div class="rv"><div class="eyebrow">Contact</div><h2 id="ctTitle"></h2><p id="ctText"></p><a class="btn primary" id="mailBtn" href="mailto:YOUR_EMAIL@example.com">Email NEXORA Studio</a></div>
  <form id="form" class="rv" style="--d:.1s" novalidate>
    <input name="name" placeholder="Your name" required autocomplete="name">
    <input name="email" type="email" placeholder="Your email" required autocomplete="email">
    <textarea name="msg" rows="4" placeholder="Tell me about your project" required></textarea>
    <button class="btn primary" type="submit" style="justify-content:center">Send message</button>
    <div class="note" id="note" role="status" aria-live="polite"></div>
  </form>
</div></section>
<footer><div class="wrap"><p class="fb"><b class="grad">NEXORA Studio</b> — Digital Experiences Beyond Ordinary.</p><div class="flinks" id="flinks"></div><p id="foot"></p></div></footer>

<script>
/* ===== 2. YOUR CONTENT — edit the text between the quote marks ===== */
const SITE = {
  brand: "NEXORA Studio", // full brand name: footer and page title
  name: "NEXORA",                       // shown in the top-left logo
  email: "YOUR_EMAIL@example.com", // ← REPLACE with your real email.             // contact form opens an email to this address
  eyebrow: "NEXORA STUDIO",
  headline: "Digital Experiences Beyond Ordinary.",
  tagline: "Creative Websites. Immersive Motion. Limitless Ideas.",
  sub: "We create modern websites with immersive visuals, thoughtful interactions and distinctive digital experiences.",
  button1: "Explore Our Work",
  button2: "Let’s Talk",
  aboutTitle: "We Think Beyond the Screen.",
  aboutText: "NEXORA Studio is a creative web design initiative focused on building modern, visually engaging digital experiences for brands and businesses.",
  aboutNote: "Our approach: clear structure, considered motion and a design that feels like your brand.",
  stats: [["3","Experiments"],["100%","Mobile-first"],["Open","For new work"]],
  skills: ["Web design","3D & motion","Responsive design","Landing pages","UI design","Redesigns"],
  projectsTitle: "Selected Experiments.",
  projectsSub: "One café demo and two fictional concepts. No client work is shown here.",
  services: [
    ["site","Modern Business Websites","Clear, fast, multi-section sites for cafés, shops and local services."],
    ["cube","3D and Motion Websites","Interactive 3D elements and smooth animation that add depth to a brand website."],
    ["layout","Landing Page Design","One focused page that explains your offer and guides visitors to act."],
    ["redo","Website Redesign","A fresh, modern, mobile-friendly rebuild for a site that feels outdated."]
  ],
  servicesTitle: "What We Create.",
  contactTitle: "Let’s Build Something Different.",
  contactText: "Have an idea? Let’s turn it into a digital experience.",
  formNote: "Front-end demo form: there is no server, so it cannot send messages itself. Submitting opens your email app with the message ready to send."
};

/* ===== 3. PROJECT CARDS =====
   TO ADD A LIVE LINK LATER: put the website address inside url:"" for that project, e.g. url:"https://your-site.com".
   While url is empty, the card shows "Coming Soon" with a disabled button.
   To add a card, copy one { ... } block and keep the comma between blocks. ===== */
const PROJECTS = [
  { title:"THE BREW ROOM", tag:"Café website demo", kind:"Demo",
    text:"A café website concept exploring warm branding and a modern digital menu.",
    tech:["Web design","Responsive"], c1:"#ff9a3c", c2:"#8b5cff", url:"https://thebrewroomcoffeecafe.my.canva.site/" },
  { title:"FUTURE FINANCE", tag:"Fictional fintech concept", kind:"Concept — Coming Soon",
    text:"A fictional fintech landing-page design concept.",
    tech:["Concept","UI design"], c1:"#2d8cff", c2:"#19e3b1", url:"" },
  { title:"NEXORA FUTURE", tag:"Futuristic tech website concept", kind:"Concept — Coming Soon",
    text:"A fictional futuristic technology brand website concept.",
    tech:["Concept","3D & motion"], c1:"#8b5cff", c2:"#ff3ea5", url:"" }
];

/* ===== 4. EFFECTS — turn things on/off or adjust strength ===== */
const RM = matchMedia('(prefers-reduced-motion:reduce)').matches; // respects the phone/computer “reduce motion” setting
const FX = { parallax:!RM, cardTilt:!RM, orbSpin:RM?0:0.0035, orbParticles:true };

/* ===== Everything below builds the page. You don’t need to edit it. ===== */
const $=id=>document.getElementById(id);
const ICONS={site:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',cube:'<svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>',layout:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>',redo:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>'};
const root=document.documentElement;
$('logo').textContent=SITE.name; $('eyebrow').textContent=SITE.eyebrow; $('headline').innerHTML=SITE.headline.replace(/(Beyond Ordinary\.?)/i,'<span class="grad">$1</span>');
$('sub').textContent=SITE.sub; $('tagline').textContent=SITE.tagline; $('cta1').textContent=SITE.button1; $('cta2').textContent=SITE.button2;
$('aboutTitle').textContent=SITE.aboutTitle; $('aboutText').textContent=SITE.aboutText; $('aboutNote').textContent=SITE.aboutNote;
$('stats').innerHTML=SITE.stats.map(s=>`<div class="stat"><b class="grad">${s[0]}</b><span>${s[1]}</span></div>`).join('');
$('skills').innerHTML=SITE.skills.map(s=>`<span class="chip">${s}</span>`).join('');
$('projTitle').textContent=SITE.projectsTitle; $('projSub').textContent=SITE.projectsSub;
$('svcTitle').textContent=SITE.servicesTitle; $('ctTitle').textContent=SITE.contactTitle; $('ctText').textContent=SITE.contactText; $('mailBtn').href='mailto:'+SITE.email; $('note').textContent=SITE.formNote;
$('foot').textContent='© '+new Date().getFullYear()+' '+SITE.brand+'. All rights reserved.';
document.title=SITE.brand+' — '+SITE.headline;
$('cards').innerHTML=PROJECTS.map((p,i)=>`<article class="card rv" style="--d:${i*.12}s"${p.url?` data-url="${p.url}"`:''}>
  <div class="art" style="background:linear-gradient(135deg,${p.c1}33,${p.c2}55),#0a1233">
    <i style="width:130px;height:130px;background:${p.c1};left:12%;top:18%;opacity:.55"></i>
    <i style="width:90px;height:90px;background:${p.c2};right:14%;top:40%;opacity:.6;animation-delay:-3s"></i>
    <i style="width:50px;height:50px;background:#fff;left:48%;top:12%;opacity:.25;animation-delay:-5s"></i>
    <div class="mock"><u></u><u></u><u></u><b></b><b></b></div><span class="badge">${p.kind}</span><span class="n">0${i+1}</span></div>
  <div class="cbody"><div class="tag">${p.tag}</div><h3>${p.title}</h3><p>${p.text}</p>
  <div class="skills">${p.tech.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
  ${p.url?`<a class="more" href="${p.url}" target="_blank" rel="noopener noreferrer" aria-label="View ${p.title} (opens in a new tab)">View Project ↗</a>`:`<button class="more off" type="button" disabled>View Project ↗</button>`}</div></article>`).join('');
$('svc').innerHTML=SITE.services.map((s,i)=>`<div class="s rv" style="--d:${i*.1}s"><div class="ic">${ICONS[s[0]]||s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('');
const NAV=[["home","Home"],["about","About"],["projects","Projects"],["services","Services"],["contact","Contact"]];
$('links').innerHTML=NAV.map(n=>`<a href="#${n[0]}" data-s="${n[0]}">${n[1]}</a>`).join('');
$('flinks').innerHTML=NAV.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join('');
$('burger').setAttribute('aria-expanded','false');
$('burger').onclick=()=>{const o=$('links').classList.toggle('open');$('burger').setAttribute('aria-expanded',String(o));$('burger').textContent=o?'✕':'☰'};
const closeMenu=()=>{$('links').classList.remove('open');$('burger').setAttribute('aria-expanded','false');$('burger').textContent='☰'};
$('links').addEventListener('click',e=>{if(e.target.tagName==='A')closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('click',e=>{if(!e.target.closest('nav'))closeMenu()});

/* reveal on scroll + active nav link */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
const secs=NAV.map(n=>$(n[0]));
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('on',a.dataset.s===e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
secs.forEach(s=>so.observe(s));

/* parallax */
if(FX.parallax){const bl=[...document.querySelectorAll('[data-speed]')];let t=false;
  addEventListener('scroll',()=>{if(t)return;t=true;requestAnimationFrame(()=>{const y=scrollY;bl.forEach(b=>b.style.transform=`translateY(${y*b.dataset.speed}px)`);t=false})},{passive:true})}

/* 3D tilt on project cards */
if(FX.cardTilt&&matchMedia('(hover:hover)').matches){document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    c.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(8px)`});
  c.addEventListener('pointerleave',()=>c.style.transform='')})}

/* clicking anywhere on a card with a live url opens that project in a new tab */
document.querySelectorAll('.card[data-url]').forEach(c=>c.addEventListener('click',e=>{if(!e.target.closest('a'))window.open(c.dataset.url,'_blank','noopener,noreferrer')}));

/* contact form → checks the fields, then opens the visitor's email app (no server or paid service needed) */
$('form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);
  const nm=(f.get('name')||'').trim(),em=(f.get('email')||'').trim(),ms=(f.get('msg')||'').trim();
  const bad=!nm?'Please enter your name.':!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?'Please enter a valid email address.':!ms?'Please write a short message.':'';
  if(bad){$('note').textContent=bad;$('note').style.color='#ff9bb0';return}
  $('note').style.color='';
  if(/example\.com$/i.test(SITE.email)){$('note').textContent='Demo mode: the site owner has not added a real email address yet.';return}
  const body=`${f.get('msg')}\n\n— ${f.get('name')} (${f.get('email')})`;
  $('note').textContent='Opening your email app…';
  location.href=`mailto:${SITE.email}?subject=${encodeURIComponent('Project enquiry from '+f.get('name'))}&body=${encodeURIComponent(body)}`});

/* interactive 3D glass sphere (Three.js) */
(function(){
  const cv=$('orb');
  try{
    const css=getComputedStyle(root),cB=new THREE.Color(css.getPropertyValue('--blue').trim()),cV=new THREE.Color(css.getPropertyValue('--violet').trim());
    const R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x000000,0);
    const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.1,50);C.position.z=10;
    const G=new THREE.Group();S.add(G);
    const glass=new THREE.Mesh(new THREE.SphereGeometry(1.7,64,64),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      uniforms:{a:{value:cB},b:{value:cV},t:{value:0}},
      vertexShader:'varying vec3 n;varying vec3 v;varying vec3 p;void main(){n=normalize(normalMatrix*normal);vec4 m=modelViewMatrix*vec4(position,1.);v=normalize(-m.xyz);p=position;gl_Position=projectionMatrix*m;}',
      fragmentShader:'uniform vec3 a;uniform vec3 b;uniform float t;varying vec3 n;varying vec3 v;varying vec3 p;void main(){float f=pow(1.-max(dot(n,v),0.),2.4);vec3 c=mix(a,b,p.y*.3+.5+.25*sin(t+p.x*1.5));float h=pow(max(dot(n,normalize(vec3(-.5,.7,.6))),0.),38.);gl_FragColor=vec4(c*(f*1.7+.07)+vec3(0.,.55,.7)*pow(f,3.)*.5+vec3(h*.9),f*.9+.12+h);}'}));
    G.add(glass);
    const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.75,1),new THREE.MeshBasicMaterial({color:cV,wireframe:true,transparent:true,opacity:.75}));G.add(core);
    const core2=new THREE.Mesh(new THREE.OctahedronGeometry(.38,0),new THREE.MeshBasicMaterial({color:cB}));G.add(core2);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(2.25,.012,8,160),new THREE.MeshBasicMaterial({color:cB,transparent:true,opacity:.7}));ring.rotation.x=1.2;G.add(ring);
    const ring2=ring.clone();ring2.material=new THREE.MeshBasicMaterial({color:cV,transparent:true,opacity:.6});ring2.scale.setScalar(1.14);ring2.rotation.set(.5,.8,0);G.add(ring2);
    const ring3=ring.clone();ring3.material=new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:.45});ring3.scale.setScalar(.82);ring3.rotation.set(1.9,.3,0);G.add(ring3);
    const sats=[[0x22d3ee,2.25,.07,.012,1.2,0],[0xb69cff,2.565,.055,-.009,.5,.8]].map(s=>{const p=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(s[2],16,16),new THREE.MeshBasicMaterial({color:s[0]}));m.position.x=s[1];p.add(m);p.rotation.set(s[4],s[5],0);p.userData.v=s[3];G.add(p);return p});
    let pts;if(FX.orbParticles){const n=220,a=new Float32Array(n*3);for(let i=0;i<n;i++){const r=2.7+Math.random()*.5,th=Math.random()*6.283,ph=Math.acos(2*Math.random()-1);a.set([r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th)],i*3)}
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));pts=new THREE.Points(g,new THREE.PointsMaterial({color:0xaec4ff,size:.03,transparent:true,opacity:.8}));S.add(pts)}
    function size(){const w=cv.clientWidth||300,h=cv.clientHeight||300;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}size();addEventListener('resize',size);
    let tx=0,ty=0,vx=0,vy=0,drag=false,lx=0,ly=0;
    cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing';cv.setPointerCapture(e.pointerId)});
    cv.addEventListener('pointermove',e=>{if(drag){vy+=(e.clientX-lx)*.0016;vx+=(e.clientY-ly)*.0016;lx=e.clientX;ly=e.clientY}
      else if(e.pointerType==='mouse'){const r=cv.getBoundingClientRect();tx=((e.clientY-r.top)/r.height-.5)*.6;ty=((e.clientX-r.left)/r.width-.5)*.8}});
    const up=()=>{drag=false;cv.style.cursor='grab'};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    let vis=true;new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(cv);
    const clk=new THREE.Clock();let fr=0;
    (function loop(){requestAnimationFrame(loop);if(!vis||document.hidden)return;if(RM&&!drag&&Math.abs(vx)+Math.abs(vy)<.0005&&fr++>3)return;const t=clk.getElapsedTime();
      G.position.y=Math.sin(t*.9)*(RM?0:.14);
      G.rotation.y+=FX.orbSpin+vy;G.rotation.x+=(tx-G.rotation.x)*.04+vx;vx*=.92;vy*=.92;
      core.rotation.y-=.012;core.rotation.x+=.006;core2.rotation.y+=.02;core2.rotation.z+=.01;ring.rotation.z+=.004;ring2.rotation.y-=.005;ring3.rotation.z-=.006;sats.forEach(p=>p.rotation.z+=p.userData.v);
      if(pts)pts.rotation.y=t*.04+G.rotation.y*.3;glass.material.uniforms.t.value=t;
      R.render(S,C)})();
  }catch(err){cv.style.display='none';$('orbFallback').style.display='block'}
})();
</script>
</body>
